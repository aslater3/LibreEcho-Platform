    "notice": "THIRD_PARTY_NOTICES.md",
    "licenses": {
      "hostapd": ["hostapd-2.10-COPYING.txt"],
      "dnsmasq": ["dnsmasq-2.90-COPYING.txt", "dnsmasq-2.90-COPYING-v3.txt"],
      "iw": ["iw-5.19-COPYING.txt"]
    }
  },
  "source_offer": {
    "description": "Corresponding-source offer for the GPL-family binaries the recovery image redistributes.",
    "components": ["dnsmasq"],
    "statement": "The complete corresponding source for the GPL-licensed dnsmasq binary is the pinned upstream archive recorded under components.dnsmasq (source_url + source_sha256). That archive, plus the pinned libnl build input, is the source that produces the shipped binary; the builder refuses to run when a GPL component is pinned here without this offer. The first-party libreecho-recovery-button detector corresponds to its source at first_party.libreecho-recovery-button.source_path in the LibreEcho-Platform repository (GPL-2.0-only)."
  },
  "notes": [
    "Hashes were computed from the real upstream archives at the pinned URLs; the builder re-verifies them and fails closed on any mismatch or missing artifact.",
    "Each component names its licence and the licence file that must exist inside the verified upstream source tree; the builder checks that file after extraction and fails closed when it is absent.",
    "hostapd is dual BSD-3-Clause/GPL-2.0; LibreEcho uses the BSD-3-Clause terms.",
    "dnsmasq ships both GPL-2.0 (COPYING) and GPL-3.0 (COPYING-v3) texts; it is distributed under either, and its corresponding source offer is recorded in the source_offer block.",
    "iw depends on libnl for its netlink transport, which Platform already pins for wpa_supplicant (libnl 3.11.0).",
    "hostapd is built with CONFIG_CRYPTO=internal and CONFIG_TLS=internal so no OpenSSL/crypto library is required; its only external dependency is the pinned libnl.",
    "libnl is declared under build_dependencies: it is verified like the components but consumed as a static build input, not staged into the recovery image."
  ]
}
