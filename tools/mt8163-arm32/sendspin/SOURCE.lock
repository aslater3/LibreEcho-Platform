        "target": "identity::sdk",
        "pristine_archive_sha256": "2749ee07e4974f3879297af12d651349df33f46125a100cc935bf6966ed8af45",
        "note": "Applied after 0001 (list order), so it diffs the 0001-patched tree. Adds PlayerRoleListener::on_stream_boundary(clear_generation): a synchronous seek boundary fired on the sync task thread inside apply_stream_clear() for both the flag and marker clear paths, once per monotonically tagged boundary. Its return value is the sink frames the consumer discarded at the boundary (the callback outcome), which are removed from sync_task's accepted-minus-played ledger (buffered_frames and new_audio_client_playtime move together) with no notify_audio_played() call, so post-seek audio is not mistaken for late and dropped. Additive default returns 0 and preserves prior behavior. Pinned archive and its sha256 are unchanged."
      }
    ],
