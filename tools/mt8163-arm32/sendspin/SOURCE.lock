        "note": "Adds SendspinStreamEndReason (NATURAL/ROLE_REMOVED/DISCONNECTED) to PlayerRoleListener::on_stream_end() through a source-compatible reason overload, and an on_stream_clear() seek notification. Applied to the SDK staged tree after its archive bytes are verified; the pinned archive and its sha256 are unchanged."
