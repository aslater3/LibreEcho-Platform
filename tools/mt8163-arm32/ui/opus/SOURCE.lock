    },
    "opus": {
      "version": "1.4",
      "license": "BSD-3-Clause",
      "license_file": "COPYING",
      "license_copy": "opus-1.4-COPYING.txt",
      "license_sha256": "8338ce8d922bb4416ce3dd1e5680173332435e3f0755007ac7801ccd674fe682",
