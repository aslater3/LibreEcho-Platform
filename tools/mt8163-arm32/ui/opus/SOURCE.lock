      "source_sha256": "c9b32b4253be5ae63d1ff16eea06b94b5f0f2951b7a02aceef58e3a3ce49c51f",
      "archive_root": "opus-1.4"
    },
    "opusfile": {
      "version": "0.12",
      "license": "BSD-3-Clause",
