name: Button backport checks

on:
  pull_request:
    paths:
      - '.github/workflows/button-backport.yml'
      - 'tools/mt8163-arm32/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  button-image-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install device-tree and Python test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y device-tree-compiler
          python3 -m pip install --disable-pip-version-check PyNaCl==1.5.0
      - name: Check bundle shell syntax
        run: bash -n tools/mt8163-arm32/ui/build_ui_bundle.sh
      - name: Check Python syntax
        run: >-
          python3 -m py_compile
          tools/mt8163-arm32/build_recovery_image.py
          tools/mt8163-arm32/verify_recovery_image.py
          tools/mt8163-arm32/build_wifi_dtb.py
          tools/mt8163-arm32/verify_radar_puffin_dtb.py
      - name: Run recovery packaging and real-DTB fixture contracts
        working-directory: tools/mt8163-arm32
        run: python3 -m unittest -v test_recovery_image_tools test_build_wifi_dtb test_verify_radar_puffin_dtb test_recovery_ap

  recovery-ap-build:
    name: Build pinned recovery-AP binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM cross toolchain and build tools
        run: |
          sudo apt-get update
          # gcc-arm-linux-gnueabihf only *recommends* libc6-dev-armhf-cross, and
          # --no-install-recommends drops it.  Without the target C library
          # headers and startup objects the cross compiler cannot link anything,
          # so libnl's configure dies with "C compiler cannot create executables".
          sudo apt-get install --no-install-recommends -y \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            bison flex pkg-config
      - name: Fetch and hash-check the pinned recovery-AP sources
        working-directory: tools/mt8163-arm32
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/recovery-ap-sources"
          mkdir -p "$cache"
          python3 - recovery-ap/SOURCE.lock "$cache" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import urllib.request

          lock = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          dest = pathlib.Path(sys.argv[2])
          records = dict(lock["components"])
          records["libnl"] = lock["build_dependencies"]["libnl"]
          for name, record in records.items():
              target = dest / record["source_url"].rsplit("/", 1)[-1]
              if not target.is_file():
                  urllib.request.urlretrieve(record["source_url"], target)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              if digest != record["source_sha256"]:
                  raise SystemExit("ERROR: %s archive hash mismatch: %s" % (name, digest))
              print("recovery_ap_source_%s_sha256=%s" % (name, digest))
          PY
      - name: Build recovery-AP binaries and emit image metadata
        working-directory: tools/mt8163-arm32
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/recovery-ap-sources"
          out="${RUNNER_TEMP}/recovery-ap-out"
          mkdir -p "$out"
          # Public cross toolchain, no repository secrets: the same builder that
          # produces the release artifacts runs here from the pinned sources.
          bash recovery-ap/build_recovery_ap.sh --build \
            --cache "$cache" \
            --libnl-archive "$cache/libnl-3.11.0.tar.gz" \
            --output "$out" \
            --cc arm-linux-gnueabihf-gcc \
            --ar arm-linux-gnueabihf-ar \
            --ranlib arm-linux-gnueabihf-ranlib \
            --strip arm-linux-gnueabihf-strip
      - name: Verify the emitted metadata is consumable by the image builder
        working-directory: tools/mt8163-arm32
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/recovery-ap-out"
          python3 - "$out" <<'PY'
          import json
          import pathlib
          import sys

          import build_recovery_image

          out = pathlib.Path(sys.argv[1])
          metadata_path = out / "recovery-ap-binaries.json"
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          assert metadata["schema"] == build_recovery_image.RECOVERY_AP_METADATA_SCHEMA
          assert set(metadata["binaries"]) == set(build_recovery_image.RECOVERY_AP_BINARIES)
          stage = out / "verify-stage"
          stage.mkdir()
          manifest = {}
          build_recovery_image.add_recovery_ap_bundle(
              stage,
              {name: out / name for name in build_recovery_image.RECOVERY_AP_BINARIES},
              metadata_path,
              manifest,
          )
          record = manifest["recovery_ap"]
          assert set(record["components"]) == set(build_recovery_image.RECOVERY_AP_BINARIES)
          assert record["source_offer"]["components"]
          print("recovery_ap_metadata_consumed=%d" % len(record["components"]))
          PY
