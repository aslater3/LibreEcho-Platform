name: Userdata 163 integration
on:
  push:
    branches: [fix/0.14-userdata-install-163]
    paths: ['.github/workflows/userdata-integration-163.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'aslater3/LibreEcho-Platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: platform
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aslater3/LibreEcho
          ref: c237bb155e4c262d0172d8cfd58acf30d423417d
          path: product
          persist-credentials: false
      - name: Install Platform test dependencies
        run: |
          set -euo pipefail
          timeout 300 sudo apt-get update
          timeout 300 sudo apt-get install --no-install-recommends -y e2fsprogs build-essential busybox device-tree-compiler squashfs-tools espeak-ng-data
          python3 -m pip install --disable-pip-version-check PyNaCl==1.5.0
      - name: Apply hash-checked source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, zlib
          data = base64.b64decode(pathlib.Path('product/build/ci/userdata-fix-163.payload').read_text(), validate=False)
          assert hashlib.sha256(data).hexdigest() == '9ffa7f5958c0972474ee5fdf03e098c79e1b64aad298b4f80840b513e5f370ca', 'bundle digest mismatch'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'userdata-fix'
          for name, content in json.loads(zlib.decompress(data)).items():
              relative = pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          PY
          python3 "$RUNNER_TEMP/userdata-fix/apply_fix.py" --product product --platform platform --apply
          cd platform
          git rm .github/workflows/userdata-integration-163.yml
          git add tools/mt8163-arm32/initramfs/libreecho-init tools/mt8163-arm32/initramfs/libreecho-update tools/mt8163-arm32/stage_feature_root.sh tools/mt8163-arm32/ota/libreecho_bootctl.c tools/mt8163-arm32/build_recovery_image.py tools/mt8163-arm32/verify_recovery_image.py tools/mt8163-arm32/test_userdata_geometry.py tools/mt8163-arm32/test_recovery_image_tools.py
          git diff --cached --check
      - name: Run runtime geometry and recovery suites
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/userdata-evidence"
          cd platform
          {
            python3 tools/mt8163-arm32/test_userdata_geometry.py --require-compiler -v
            python3 tools/mt8163-arm32/test_recovery_image_tools.py
            cc -Wall -Wextra -Werror tools/mt8163-arm32/ota/libreecho_bootctl.c -o "$RUNNER_TEMP/libreecho-bootctl-host"
            for script in initramfs/libreecho-init initramfs/libreecho-update stage_feature_root.sh; do
              /bin/busybox sh -n "tools/mt8163-arm32/$script"
            done
            git diff --cached --check
          } 2>&1 | tee "$RUNNER_TEMP/userdata-evidence/tests.txt"
      - name: Commit validated source on the fix branch only
        run: |
          set -euo pipefail
          cd platform
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(platform): accept both reviewed Biscuit userdata geometries'
          timeout 120 git push origin HEAD:refs/heads/fix/0.14-userdata-install-163
          git rev-parse HEAD | tee "$RUNNER_TEMP/userdata-evidence/tested-head.txt"
          git diff 79e59f1e7d3252745ca78c164609ec29418ffa00 HEAD > "$RUNNER_TEMP/userdata-evidence/platform.patch"
      - name: Save bounded host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: userdata-platform-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/userdata-evidence
          if-no-files-found: ignore
          retention-days: 7
