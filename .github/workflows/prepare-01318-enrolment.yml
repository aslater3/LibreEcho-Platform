name: Prepare bounded 0.13.18 enrolment fix
on:
  push:
    branches: ['fix/0.13.18-vendor-enrolment-172']
    paths: ['.github/prepare-01318-enrolment.py', '.github/workflows/prepare-01318-enrolment.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'aslater3/LibreEcho-Platform' && github.ref == 'refs/heads/fix/0.13.18-vendor-enrolment-172'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply exact patch and run firmware enrolment regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/0.13.18-vendor-enrolment-172
          python3 .github/prepare-01318-enrolment.py
          timeout 120s python3 tools/mt8163-arm32/test_vendor_import_compat.py -v
          /bin/sh -n tools/mt8163-arm32/initramfs/libreecho-vendor-import
          python3 -m py_compile tools/mt8163-arm32/test_vendor_import_compat.py tools/mt8163-arm32/build_recovery_image.py
          git diff --check
          git add tools/mt8163-arm32/initramfs/libreecho-vendor-import tools/mt8163-arm32/initramfs/vendor-assets/README.md tools/mt8163-arm32/test_vendor_import_compat.py tools/mt8163-arm32/build_recovery_image.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: verify durable owner-local firmware enrolment for 0.13.18'
          git push origin "HEAD:$GITHUB_REF_NAME"
