name: Issue 169 audited repin

on:
  push:
    branches:
      - fix/0.14-ota-health-mdns-169

permissions:
  contents: write

jobs:
  repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Apply exact audited pin and fixture updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "fe2b0738af1960cab6a44a29298a10bb8216b89673814729c8ee9a6885bca3f6"
          new = "4c358bbc71ed2e14ebb0222653736e5478e80886d3614055d9f0f0e69935f05e"
          for name, symbol in (
              ("tools/mt8163-arm32/build_recovery_image.py", "RECOVERY_INIT_SHA256"),
              ("tools/mt8163-arm32/verify_recovery_image.py", "INIT_SHA256"),
          ):
              path = Path(name)
              text = path.read_text()
              needle = f'{symbol} = "{old}"'
              replacement = f'{symbol} = "{new}"'
              if text.count(needle) != 1:
                  raise SystemExit(f"expected exactly one audited pin in {name}")
              path.write_text(text.replace(needle, replacement))

          path = Path("tools/mt8163-arm32/test_recovery_image_tools.py")
          text = path.read_text()
          old_fixture = '"/run/libreecho/mdns/dbus/system_bus_socket", str(mdns_socket)'
          new_fixture = '"$MDNS_RUNTIME_ROOT/run/dbus/system_bus_socket", str(mdns_socket)'
          if text.count(old_fixture) != 1:
              raise SystemExit("expected exactly one legacy shared-mDNS fixture path")
          path.write_text(text.replace(old_fixture, new_fixture))
          PY
          git diff --check
          git diff --exit-code -- .github/workflows/issue169-repin.yml || true
          git diff -- tools/mt8163-arm32/build_recovery_image.py \
                    tools/mt8163-arm32/verify_recovery_image.py \
                    tools/mt8163-arm32/test_recovery_image_tools.py
      - name: Commit audited updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/mt8163-arm32/build_recovery_image.py \
                  tools/mt8163-arm32/verify_recovery_image.py \
                  tools/mt8163-arm32/test_recovery_image_tools.py
          git commit -m 'test: repin recovery init and mDNS health fixture'
          git push origin HEAD:fix/0.14-ota-health-mdns-169
