name: LibreEcho Platform checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_checks:
    name: Platform source checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Platform source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyNaCl==1.5.0

      - name: Run maintained Platform suites
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q \
            tools/mt8163-arm32/test_recovery_image_tools.py \
            tools/mt8163-arm32/test_source_offer_tools.py

      - name: Validate tracked Python and shell source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mt8163-arm32/build_recovery_image.py \
            tools/mt8163-arm32/verify_recovery_image.py \
            tools/mt8163-arm32/ota/make_ota_bundle.py
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z 'tools/mt8163-arm32/*.sh' 'tools/mt8163-arm32/**/*.sh')
          git diff --check
