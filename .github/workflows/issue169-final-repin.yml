name: Issue 169 final audited repin

on:
  push:
    branches:
      - fix/0.14-ota-health-mdns-169

permissions:
  contents: write

jobs:
  repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Apply exact audited recovery init digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "4c358bbc71ed2e14ebb0222653736e5478e80886d3614055d9f0f0e69935f05e"
          new = "4c358bbc7bb35022895585dbc7e653b78fd5f6396345f495168c676afedcbb77"
          for name, symbol in (
              ("tools/mt8163-arm32/build_recovery_image.py", "RECOVERY_INIT_SHA256"),
              ("tools/mt8163-arm32/verify_recovery_image.py", "INIT_SHA256"),
          ):
              path = Path(name)
              text = path.read_text()
              needle = f'{symbol} = "{old}"'
              replacement = f'{symbol} = "{new}"'
              if text.count(needle) != 1:
                  raise SystemExit(f"expected exactly one stale audited pin in {name}")
              path.write_text(text.replace(needle, replacement))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/mt8163-arm32/build_recovery_image.py tools/mt8163-arm32/verify_recovery_image.py
          git commit -m 'build: correct audited recovery init digest'
          git push origin HEAD:fix/0.14-ota-health-mdns-169
