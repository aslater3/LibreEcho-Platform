name: Update exact audio startup contract
# One-shot test-source update; never writes a ref, commit or release.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-168-lived-packaging'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Update obsolete programme-before-unmute assertion
        shell: python
        run: |
          import pathlib, subprocess
          base = 'e1ab8f92c5a80cba6016ddb08f0bf4b48fbc94c3'
          assert subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip() == base
          subprocess.run(['git','checkout','--detach',base],check=True)
          path = pathlib.Path('tools/mt8163-arm32/test_recovery_image_tools.py')
          assert subprocess.check_output(['git','hash-object',str(path)]).decode().strip() == '059ca6eb9f5431e684a4a2319af5ef2941e8817f'
          old = '        self.assertLess(power_amp, first_write)\n        self.assertLess(first_write, unmute)\n'
          new = '\n'.join([
              '        prime = source.index("write_period(pcm, prime_silence, &reference, 0)")',
              '        self.assertIn(',
              '            "static const int16_t prime_silence[PERIOD_SIZE * OUTPUT_CHANNELS] = {0};",',
              '            source,',
              '        )',
              '        self.assertLess(power_amp, prime)',
              '        self.assertLess(prime, unmute)',
              '        self.assertLess(unmute, first_write)',
              '',
          ])
          source = path.read_text()
          assert source.count(old) == 1, repr(old)
          path.write_text(source.replace(old,new))
          subprocess.run(['git','diff','--check'],check=True)
      - name: Run the updated production-source assertion
        run: |
          python3 -m pip install --disable-pip-version-check PyNaCl==1.5.0
          cd tools/mt8163-arm32
          python3 -m unittest -v test_recovery_image_tools.SourceTests.test_shared_audio_engine_starts_dma_before_releasing_amp
      - name: Upload immutable verified test tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          path = 'tools/mt8163-arm32/test_recovery_image_tools.py'
          assert subprocess.check_output(['git','diff','--name-only']).decode().strip() == path
          def post(kind,payload):
              req=urllib.request.Request('https://api.github.com/repos/aslater3/LibreEcho-Platform/git/'+kind,
                  data=json.dumps(payload).encode(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          data=pathlib.Path(path).read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert post('blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})['sha']==sha
          tree=post('trees',{'base_tree':'ac72b085b4d60bc089320c6ee85eab813b818213',
              'tree':[{'path':path,'mode':'100644','type':'blob','sha':sha}]})['sha']
          result={'tree_sha':tree,'path':path,'blob_sha':sha,'base':'e1ab8f92c5a80cba6016ddb08f0bf4b48fbc94c3'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'audio-startup-contract-tree.json').write_text(json.dumps(result))
          print(json.dumps(result))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audio-startup-contract-tree
          path: ${{ runner.temp }}/audio-startup-contract-tree.json
          retention-days: 1
          if-no-files-found: error
